<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just One Question ❤️</title>

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
}

h1 {
    font-size:32px;
    color:white;
    margin-bottom:40px;
}

.buttons {
    position:relative;
}

button {
    padding:15px 28px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
}

#yes {
    background:#28a745;
    color:white;
}

#no {
    background:#dc3545;
    color:white;
    position:absolute;
    left:140px;
}

</style>
</head>

<body>

<h1>Will you go out with me? ❤️</h1>
<img src="Untitled design.png" style="width:120px; margin-bottom:20px;">
<div class="buttons">
    <button id="yes" onclick="yesClick()">Yes</button>
    <button id="no" onmouseover="noHover()">No</button>
</div>

<script>

let messages = [
"Are you sure? 🥺",
"Really sure? 😢",
"Think again 😭",
"I'll be sad 💔",
"Last chance 😤",
"Pakki baat? 😑",
"Andi Mandi 😈",
"Aapko Baash ki Kasam 😤",
"Offer dilaunga, ab to maan jaa 🥺"
];
  
let index = 0;
let yesSize = 20;

function noHover(){
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    // Move NO randomly
    noBtn.style.top = Math.random()*200 - 100 + "px";
    noBtn.style.left = Math.random()*200 + 80 + "px";

    // Change text
    noBtn.textContent = messages[index % messages.length];
    index++;

    // Grow YES button
    yesSize += 8;
    yesBtn.style.fontSize = yesSize + "px";
}

function yesClick(){
    document.body.innerHTML =
    "<h1 style='font-size:48px;color:white;'>YAY!!! ❤️🥳</h1>";
}

</script>

</body>
</html>
